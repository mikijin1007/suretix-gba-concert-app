<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大湾区观演 · 暗色电影票务风 v1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 50% -10%,#1a1a1d 0%,#0a0a0b 60%);font-family:-apple-system,'PingFang SC',sans-serif;min-height:100vh;padding:56px 24px 90px;display:flex;flex-direction:column;align-items:center}
.h-title{color:#fff;font-size:26px;font-weight:800;letter-spacing:.5px;text-align:center}
.h-title i{color:#E8B65A;font-style:italic}
.h-sub{color:#8A8A8E;font-size:12px;text-align:center;margin:8px 0 44px;letter-spacing:3px;text-transform:uppercase}
.row{display:flex;gap:34px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:16px}
.tag{background:rgba(232,182,90,.12);color:#E8B65A;font-size:10px;font-weight:700;padding:6px 18px;border-radius:20px;letter-spacing:2px;border:1px solid rgba(232,182,90,.35)}
.phone{width:360px;height:760px;background:#0A0A0B;border-radius:46px;overflow:hidden;position:relative;flex-shrink:0;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 8px #1c1c1e,0 0 0 10px #2a2a2d}
.screen{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;color:#fff}
.screen::-webkit-scrollbar{display:none}
/* status bar */
.sb{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 4px;font-size:13px;font-weight:600;position:relative;z-index:20}
.sb .r{display:flex;gap:6px;align-items:center;font-size:12px}
/* amber button */
.btn-amber{background:linear-gradient(135deg,#E8B65A,#C9962F);color:#1a1200;font-weight:800;border:none;border-radius:26px;padding:15px;width:100%;font-size:15px;letter-spacing:.5px;box-shadow:0 8px 24px rgba(201,150,47,.35)}
.pill{border-radius:20px;padding:8px 16px;font-size:12px;font-weight:600;white-space:nowrap}
.glass{background:rgba(28,28,30,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
.badge-hard{background:rgba(64,192,120,.15);color:#4EC38A;border:1px solid rgba(78,195,138,.4)}
.badge-guar{background:rgba(232,182,90,.14);color:#E8B65A;border:1px solid rgba(232,182,90,.4)}
</style></head>
<body>
<div class="h-title">大湾区观演 · <i>暗色电影票务风</i></div>
<div class="h-sub">Dark Cinematic · Amber · Ticket-Stub</div>
<div class="row" id="root"></div>
<script src="mockup_dark_v1.js"></script>
</body></html>
